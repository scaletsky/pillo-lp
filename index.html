<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pillo — Cronograma inteligente de medicamentos para pets</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    body {
      background: #FAFAF7;
      color: #2C2040;
      font-family: 'DM Sans', sans-serif;
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
    }

    /* Scroll reveal */
    .reveal {
      opacity: 0;
      transform: translateY(28px);
      transition: opacity 0.65s cubic-bezier(0.22,1,0.36,1), transform 0.65s cubic-bezier(0.22,1,0.36,1);
    }
    .reveal.visible { opacity: 1; transform: translateY(0); }
    .reveal-d1 { transition-delay: 0.08s; }
    .reveal-d2 { transition-delay: 0.16s; }
    .reveal-d3 { transition-delay: 0.24s; }

    /* Animations */
    @keyframes float { 0%,100% { transform: translateY(0px); } 50% { transform: translateY(-10px); } }
    @keyframes pulse-glow { 0%,100% { opacity: 0.55; } 50% { opacity: 1; } }
    @keyframes row-in { from { opacity: 0; transform: translateX(-10px); } to { opacity: 1; transform: translateX(0); } }
    @keyframes blob-drift { 0%,100% { transform: scale(1) rotate(0deg); } 50% { transform: scale(1.04) rotate(3deg); } }

    /* Accessible focus ring — purple outline */
    :focus { outline: none; }
    a:focus-visible,
    button:focus-visible,
    input:focus-visible,
    textarea:focus-visible,
    select:focus-visible,
    [tabindex]:focus-visible {
      outline: 2px solid #995CD6 !important;
      outline-offset: 3px;
      border-radius: 4px;
    }
    /* Pill-shaped controls keep their rounded shape */
    a.focus-pill:focus-visible,
    button.focus-pill:focus-visible,
    input.focus-pill:focus-visible {
      border-radius: 1000px;
    }

    /* Nav links hide on mobile */
    @media (max-width: 768px) {
      .nav-links { display: none !important; }
      .hero-grid { grid-template-columns: 1fr !important; text-align: center; }
      .hero-ctas { justify-content: center !important; }
      .hero-drag-card { display: none !important; }
      .steps-connector { display: none !important; }
      .features-big { grid-column: span 12 !important; grid-template-columns: 1fr !important; }
      .features-sm { grid-column: span 12 !important; }
      .footer-inner { flex-direction: column !important; align-items: flex-start !important; gap: 20px !important; }
    }
    @media (min-width: 769px) and (max-width: 1024px) {
      .features-big { grid-column: span 12 !important; }
      .features-sm { grid-column: span 6 !important; }
    }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel" src="ios-frame.jsx"></script>
  <script type="text/babel" src="sections.jsx"></script>
  <script type="text/babel" src="tweaks-panel.jsx"></script>
  <script type="text/babel" src="app.jsx"></script>
</body>
</html>
